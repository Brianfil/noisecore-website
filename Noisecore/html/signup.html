<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP | Noisecore</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="container-logo">
                <img src="../../asset/Group 59.png" alt="noisecore logo"/>
            </div>
            
            <!-- for 768px -->
            <button type="button" id="openDrawer" class="drawer-toggle">☰</button>

            
            <!-- nav links utk desktop -->
            <ul class="nav-links" id="navLinks">
                <li><a href="../html/index.html">Home</a></li>
                <li><a href="../html/products.html">Products</a></li>
                <li><a href="../html/about.html">About</a></li>
                <li><a href="../html/deals.html">Deals</a></li>
                <li><a href="../html/login.html">Login</a></li>
            </ul>

            <div class="searchbar">
                <input type="text" placeholder="Search"/>
                <button type="button" aria-label="Search">
                    <img src="../../asset/search-bar-01.png" alt="Search" class="search-icon">
                </button>
            </div>

            <!-- sliding menu toggle untuk hp -->
            <div class="drawer-menu" id="drawerMenu">
                <div class="drawer-header">
                    <button id="closeDrawer" class="drawer-close">✕</button>
                </div>
                <ul class="drawer-links">
                  <li><a href="../html/index.html" class="underlined">Home</a></li>
                  <li><a href="../html/products.html">Products</a></li>
                  <li><a href="../html/about.html">About</a></li>
                  <li><a href="../html/deals.html">Deals</a></li>
                  <li><a href="../html/login.html">Login</a></li>
                </ul>
              </div>
        </div>
    </header>

    <section class="signup">
        <div class="signup-left">
            <div class="overlay">
            <h1>Don't Just Listen</h1>
            <p>Immerse Yourself With the Music</p>
            </div>
        </div>

        <div class="signup-right">
            <form id="signupForm">
            <h2>Create Account</h2>

            <label>Full Name</label>
            <input type="text" id="name" />

            <label>Email</label>
            <input type="email" id="email" />

            <label>Gender</label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="male" /> Male</label>
                <label><input type="radio" name="gender" value="female" /> Female</label>
            </div>

            <label>Date of Birth</label>
            <input type="date" id="dob" />

            <label>Password</label>
            <input type="password" id="password" />

            <label><input type="checkbox" id="agree" /> I agree to the terms and condition</label>

            <button type="submit">Sign Up</button>
            <p id="formError" class="error-msg"></p>
            </form>
        </div>
    </section>


    <footer class="footer">
        <div class="footer-left">
            <img src="../../asset/Group 59.png" alt="Noisecore Logo" class="footer-logo" />
            <p>©2025 Noisecore. All Rights Reserved.</p>
        </div>
        <div class="footer-right">
            <a href="#">PRIVACY POLICY</a>
            <a href="#">TERMS & CONDITION</a>
            <a href="#">CONTACT US</a>
            <a href="#">FAQ</a>
            <a href="#">SUPPORT</a>
        </div>
    </footer>

    <script src="../js/navbar.js"></script>
    <script src="../js/signup.js"></script>
</body>
</html>
